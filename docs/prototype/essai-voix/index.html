<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai de voix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Dela+Gothic+One&display=swap">
<style>
:root { --fond: #eeefe9; --case: #fbfbf7; --encre: #111; --encre-2: #3b3d40; --accent: #d9a11a; --filet: #111; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fond: #121214; --case: #1c1c20; --encre: #f1f1ec; --encre-2: #b9b9b2; --filet: #f1f1ec; color-scheme: dark; } }
:root[data-theme="dark"] { --fond: #121214; --case: #1c1c20; --encre: #f1f1ec; --encre-2: #b9b9b2; --filet: #f1f1ec; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 400 17px/1.45 'Atkinson Hyperlegible Next', system-ui, sans-serif; }
::selection { background: var(--accent); color: #111; }
main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 56px; }
h1 { margin: 0 0 8px; font: 400 clamp(30px, 5vw, 46px)/1.05 'Dela Gothic One', sans-serif; }
.intro { margin: 0 0 28px; color: var(--encre-2); max-width: 62ch; }
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
section { background: var(--case); box-shadow: 0 0 0 3px var(--filet); padding: 20px 20px 22px; display: grid; gap: 14px; align-content: start; }
section h2 { margin: 0; font: 400 26px/1.1 'Dela Gothic One', sans-serif; }
section p { margin: 0; color: var(--encre-2); font-size: 15px; }
button { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px; text-align: left; background: transparent; color: var(--encre); border: 2px solid var(--filet); font: 600 15px/1.3 inherit; cursor: pointer; }
button:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.joue { background: var(--accent); color: #111; border-color: #111; }
button svg { width: 26px; height: 26px; }
</style>
<main>
  <h1>Quelle voix pour l'écran géant ?</h1>
  <p class="intro">Les mêmes quatre phrases, en trois versions. Écoute surtout « Greed Island » (en anglais) et « Clear », « Book », « Hunters » (en français). Dis-moi la lettre que tu préfères.</p>
  <div class="grille" id="grille"></div>
</main>
<script>
const PHRASES = ['Bienvenue dans Greed Island !', 'Clear ! Un joueur a réuni toutes les cartes désignées !', "Le Sceau d'Ange ! Un joueur a scellé le Book d'un autre joueur.", 'Alerte ! La Brigade attaque ! Tous les Hunters au combat !'];
const VERSIONS = [
  ['a', 'A · Rémy, en français', 'La voix de ta vidéo, avec la langue annoncée en français. Elle peut encore prendre l\'accent anglais toute seule sur certains mots.'],
  ['b', 'B · Henri, 100 % français', 'Une autre voix d\'homme de Microsoft, qui ne parle que français. « Greed Island » est dit à part par Rémy en anglais, puis recollé.'],
  ['c', 'C · Rémy, mots francisés', 'La voix de ta vidéo, mais Clear, Book et Hunters sont écrits « à la française » pour qu\'elle les prononce en français.'],
];
const ICONE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
let lecteur = null, boutonActif = null;
document.getElementById('grille').innerHTML = VERSIONS.map(([v, titre, texte]) => `<section><h2>${titre}</h2><p>${texte}</p>${PHRASES.map((p, i) => `<button data-f="${v}${i}.mp3">${ICONE}<span>${p}</span></button>`).join('')}</section>`).join('');
document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
  if (lecteur) lecteur.pause();
  if (boutonActif) boutonActif.classList.remove('joue');
  lecteur = new Audio(b.dataset.f); boutonActif = b; b.classList.add('joue');
  lecteur.onended = () => b.classList.remove('joue');
  lecteur.play().catch(() => b.classList.remove('joue'));
}));
</script>
</html>
