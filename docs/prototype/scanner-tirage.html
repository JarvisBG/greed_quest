<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner de Greed Island</title>
<meta name="description" content="Prototype de la page scanner : viseur, tirage en cinématique dont l'intensité suit le rang, carte qui se retourne puis vole dans le Book, refus en clair, Second souffle, file hors ligne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,800;1,400&family=Dela+Gothic+One&family=DotGothic16&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Page ⑥ : le scanner. La planche reste claire ; au tirage, la nuit sort du QR, une carte de dos jaillit
   dans un nuage de fumée, ses bords fuient la lumière de son rang (plus le rang est haut, plus l'attente
   et l'éclat durent), elle se retourne en frappant, puis vole se ranger dans l'onglet Book. */
:root {
  color-scheme: light;
  --papier: #eeefe9;
  --case: #fbfbf7;
  --case-2: #ecece6;
  --encre: #111111;
  --encre-2: #3b3d40;
  --trame: rgba(17, 17, 17, 0.16);
  --rouge: #c0272d;
  --bleu: #1f4a9c;
  --jaune: #d9a11a;
  --or: #d7b25a;
  --succes: #17713a;
  --alerte: #b3161c;
  --nuit: #0c0c0e;
  --f-titre: 'Dela Gothic One', 'Arial Black', sans-serif;
  --f-texte: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif;
  --f-chiffre: 'Atkinson Hyperlegible Mono', ui-monospace, monospace;
  --f-jeu: 'DotGothic16', ui-monospace, monospace;
  --trait: 3px;
  --sortie: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--papier); color: var(--encre); font: 400 17px/1.45 var(--f-texte); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--jaune); color: var(--encre); }
:focus-visible { outline: 3px solid var(--bleu); outline-offset: 3px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.app { max-width: 480px; margin: 0 auto; padding: 0 16px 104px; display: grid; gap: 10px; }
.app > * { min-width: 0; }

/* Commandes du prototype (pas dans l'app) */
.proto { display: grid; gap: 7px; padding: 10px 12px; margin-inline: -16px; background: var(--encre); color: var(--case); }
.proto p { margin: 0; font: 600 13px/1.3 var(--f-texte); }
.proto .rang { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.proto .rang > span { font: 800 12px var(--f-texte); color: #b9bcc2; min-width: 44px; }
.proto button { min-height: 36px; padding: 0 10px; border: 2px solid var(--case); background: transparent; color: var(--case); font: 700 13px var(--f-texte); }
.proto button[aria-pressed='true'] { background: var(--case); color: var(--encre); }

/* Barre d'état de l'app */
.barre { position: sticky; top: 0; z-index: 30; margin-inline: -16px; padding: 10px 16px; background: var(--case); border-bottom: var(--trait) solid var(--encre); display: flex; align-items: center; gap: 12px; min-height: 58px; }
.chrono { font: 800 30px/1 var(--f-chiffre); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.liaison { display: flex; align-items: center; gap: 6px; font: 600 14px var(--f-texte); }
.pastille { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--encre); background: var(--succes); display: inline-block; }
.pastille.hors { background: var(--alerte); }
.jenny { margin-left: auto; font: 800 22px/1 var(--f-chiffre); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-block; }
.jenny small { font: 600 15px var(--f-texte); margin-left: 3px; }

/* En-tête de page */
.tete-page { display: flex; align-items: baseline; gap: 12px; padding-top: 6px; }
.tete-page h1 { margin: 0; font: 400 30px/1 var(--f-titre); }
.tete-page .gps { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 600 14px var(--f-texte); color: var(--encre-2); }

/* ---------- Viseur ---------- */
.viseur { position: relative; aspect-ratio: 4 / 5; border: var(--trait) solid var(--encre); overflow: hidden; background: #3a4a3e; cursor: pointer; touch-action: manipulation; isolation: isolate; }
.viseur:focus-visible { outline-offset: 4px; }
/* Image de caméra simulée : un parc flou, un piquet, la plaque de la balise */
.flux { position: absolute; inset: -6%; will-change: transform; }
.flux .fond { position: absolute; inset: 0; filter: blur(9px) saturate(0.95);
  background:
    radial-gradient(40% 30% at 18% 22%, #dfe9ef 0, transparent 70%),
    radial-gradient(35% 26% at 80% 14%, #cfdde6 0, transparent 70%),
    radial-gradient(30% 40% at 12% 58%, #4f6b45 0, transparent 70%),
    radial-gradient(34% 44% at 88% 52%, #5b7a4d 0, transparent 70%),
    radial-gradient(60% 30% at 50% 96%, #6d6250 0, transparent 70%),
    linear-gradient(180deg, #a9bfcc 0%, #b8c8c2 34%, #6f8b5f 52%, #56704a 70%, #7a6c55 100%); }
.piquet { position: absolute; left: 50%; top: 52%; width: 9%; height: 70%; translate: -50% 0; background: linear-gradient(90deg, #4a3626, #7d5d41 45%, #3e2e20); filter: blur(1.2px); }
.plaque { position: absolute; left: 50%; top: 44%; width: 40%; translate: -50% -50%; rotate: -3deg; background: #f3f3ee; padding: 6% 6% 4%; border-radius: 3px; box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.55); filter: blur(0.3px); }
.plaque svg { display: block; width: 100%; height: auto; }
.plaque small { display: block; text-align: center; margin-top: 4%; font: 400 clamp(8px, 2.4vw, 11px)/1 var(--f-jeu); letter-spacing: 0.04em; color: #222; }
/* Coins du viseur : blanc cerné d'encre, lisibles sur toute image */
.cible { position: absolute; left: 50%; top: 44%; width: 66%; aspect-ratio: 1; translate: -50% -50%; pointer-events: none; }
.coin { position: absolute; width: 22%; aspect-ratio: 1; }
.coin::before, .coin::after { content: ''; position: absolute; inset: 0; border-style: solid; border-width: 0; }
.coin::before { border-color: var(--encre); }
.coin::after { border-color: #fff; inset: 2px; transition: border-color 0.2s; }
.coin.hg { left: 0; top: 0; } .coin.hd { right: 0; top: 0; } .coin.bg { left: 0; bottom: 0; } .coin.bd { right: 0; bottom: 0; }
.coin.hg::before { border-width: 10px 0 0 10px; } .coin.hg::after { border-width: 6px 0 0 6px; }
.coin.hd::before { border-width: 10px 10px 0 0; } .coin.hd::after { border-width: 6px 6px 0 0; }
.coin.bg::before { border-width: 0 0 10px 10px; } .coin.bg::after { border-width: 0 0 6px 6px; }
.coin.bd::before { border-width: 0 10px 10px 0; } .coin.bd::after { border-width: 0 6px 6px 0; }
.cible.refus .coin::after { border-color: #ff6b5e; }
.viseur .eclair { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.viseur .bandeau { position: absolute; left: 0; right: 0; bottom: 0; padding: 11px 14px 12px; background: var(--encre); color: var(--case); font: 800 16px/1.2 var(--f-texte); text-align: center; }
.viseur .bandeau span { display: block; font: 400 13px/1.3 var(--f-texte); color: #c9ccd1; margin-top: 2px; }

/* ---------- File hors ligne ---------- */
/* File hors ligne : en tête du viseur, cartes de dos empilées */
.file { position: absolute; top: 10px; left: 10px; right: 10px; display: none; align-items: center; gap: 12px; padding: 8px 12px 8px 10px; background: var(--case); border: var(--trait) solid var(--encre); cursor: default; }
.file.visible { display: flex; }
.pile { position: relative; width: 44px; height: 46px; flex: none; }
.pile .gi-carte { position: absolute; width: 30px; left: 0; top: 0; }
.pile .gi-carte:nth-child(2) { left: 5px; top: 1px; rotate: 6deg; }
.pile .gi-carte:nth-child(3) { left: 10px; top: 2px; rotate: 12deg; }
.file p { margin: 0; font: 400 14px/1.3 var(--f-texte); color: var(--encre-2); }
.file p b { display: block; font: 800 16px/1.2 var(--f-texte); color: var(--encre); }

/* ---------- Réponse du jeu, posée sur le bas du viseur (refus, file) : tout tient dans un écran ---------- */
.reponse { position: absolute; left: 8px; right: 8px; bottom: 8px; cursor: default; }
.reponse:empty { display: none; }
.reponse:not(:empty) ~ .bandeau, .viseur:has(.reponse:not(:empty)) .bandeau { visibility: hidden; }
.gi-dialogue .a-actions { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
.gi-dialogue .a-actions .clair { background: #f6f6f2; color: var(--nuit); border: 0; font: 400 17px/1.1 var(--f-jeu); padding: 12px 14px; min-height: 48px; }
.gi-dialogue .a-actions .discret { background: none; border: 0; color: #f6f6f2; font: 400 16px var(--f-jeu); min-height: 48px; padding: 0 4px; text-decoration: underline; text-underline-offset: 4px; }
.gi-dialogue .souffle-ligne { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; }
.gi-dialogue .souffle-ligne p { margin: 0; font: 400 15px/1.35 var(--f-texte); color: #d5d7db; }
.gi-dialogue .souffle-ligne b { color: #f2c84b; }
.gi-dialogue { background: var(--nuit); color: #f6f6f2; border-radius: 6px; box-shadow: inset 0 0 0 3px var(--nuit), inset 0 0 0 5px #f6f6f2, inset 0 0 0 8px var(--nuit), inset 0 0 0 9px #f6f6f2, 0 10px 24px -10px rgba(0, 0, 0, 0.6); padding: 18px 20px 16px; display: grid; gap: 10px; }
.gi-dialogue .a-qui { justify-self: start; font: 400 15px/1 var(--f-jeu); background: #f6f6f2; color: var(--nuit); padding: 4px 8px; }
.gi-dialogue .a-qui.refus { background: #ff8c86; }
.gi-dialogue .a-texte { font: 400 19px/1.45 var(--f-jeu); margin: 0; min-height: 1.45em; }
.gi-btn-trait { min-height: 56px; border: var(--trait) solid var(--encre); padding: 10px 16px; background: var(--case); font: 800 17px/1.15 var(--f-texte); }
@media (hover: hover) { .gi-btn-trait:hover { background: var(--case-2); } }
.gi-lien { background: none; border: 0; padding: 6px 0; min-height: 48px; font: 600 16px var(--f-texte); color: var(--encre); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; justify-self: start; }

/* Saisie du code (secours si la caméra ne lit pas) */
.saisie { display: none; grid-template-columns: 1fr auto; gap: 8px; }
.saisie.visible { display: grid; }
.gi-champ { width: 100%; min-height: 56px; border: var(--trait) solid var(--encre); background: var(--case); padding: 10px 14px; font: 600 19px var(--f-texte); caret-color: var(--rouge); }
.gi-champ::placeholder { color: #62656a; font-weight: 400; }

/* ---------- Onglets ---------- */
.onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--case); border-top: var(--trait) solid var(--encre); padding-bottom: env(safe-area-inset-bottom, 0px); }
.onglets button { position: relative; min-height: 64px; border: 0; border-right: 1.5px solid var(--encre); background: transparent; display: grid; justify-items: center; align-content: center; gap: 3px; font: 800 12.5px/1 var(--f-texte); padding: 6px 2px; }
.onglets button:last-child { border-right: 0; }
.onglets svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.onglets button[aria-current='page'] { background: var(--encre); color: var(--case); }
.onglets .plus-un { position: absolute; top: -30px; left: 50%; translate: -50% 0; font: 400 22px/1 var(--f-titre); color: var(--encre); background: var(--case); border: var(--trait) solid var(--encre); padding: 3px 8px; pointer-events: none; }

/* ---------- Carte de Greed Island (copie de @gq/ui) ---------- */
.gi-carte { container-type: inline-size; aspect-ratio: 63 / 88; width: 100%; position: relative; }
.gi-carte .c-cadre { position: absolute; inset: 0; border-radius: 4.5cqi; padding: 5cqi; background: var(--cadre, var(--rouge)); box-shadow: inset 0 0 0 0.8cqi rgba(0, 0, 0, 0.35); display: grid; grid-template-rows: auto 1fr auto; gap: 3cqi; }
.gi-carte.f-sort { --cadre: var(--bleu); }
.gi-carte.f-objet { --cadre: var(--jaune); }
.gi-carte.f-designee .c-txt { font-style: italic; }
.gi-carte .c-tete { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 3cqi; background: var(--case); border-radius: 2cqi; padding: 2.5cqi 3cqi; box-shadow: 0 0 0 0.7cqi rgba(0, 0, 0, 0.55); }
.gi-carte .c-num { font: 800 9cqi/1 var(--f-chiffre); font-variant-numeric: tabular-nums; }
.gi-carte .c-num.long { font-size: 7.4cqi; }
.gi-carte .c-nom { font: 800 6.4cqi/1.1 var(--f-texte); text-align: center; text-wrap: balance; hyphens: auto; overflow-wrap: break-word; }
.gi-carte .c-nom.long { font-size: 5.6cqi; }
.gi-rang { font: 400 7cqi/1 var(--f-titre); padding: 1.6cqi 2.4cqi; border-radius: 1.6cqi; white-space: nowrap; color: var(--encre); background: var(--matiere, var(--case)); box-shadow: 0 0 0 0.6cqi var(--encre); }
.gi-carte .c-art { border-radius: 2cqi; background: #f4f2ea radial-gradient(var(--trame) 0.9px, transparent 1.1px) 0 0 / 5px 5px; box-shadow: 0 0 0 0.7cqi rgba(0, 0, 0, 0.55); display: grid; place-items: center; overflow: hidden; min-height: 0; }
.gi-carte .c-filigrane { font: 400 30cqi/1 var(--f-titre); color: transparent; -webkit-text-stroke: 0.9cqi rgba(17, 17, 17, 0.55); letter-spacing: -0.02em; }
.gi-carte .c-txt { margin: 0; background: var(--case); border-radius: 2cqi; padding: 3cqi 3.5cqi; font: 400 5.6cqi/1.3 var(--f-texte); box-shadow: 0 0 0 0.7cqi rgba(0, 0, 0, 0.55); }
.r-SS { --matiere: linear-gradient(125deg, #9c7a1c 0%, #f6dc85 28%, #c39a2c 50%, #fbe7a6 72%, #a8841f 100%); }
.r-S  { --matiere: linear-gradient(125deg, #8d949b 0%, #f1f3f5 35%, #aab1b8 60%, #e9ecef 100%); }
.r-A  { --matiere: linear-gradient(125deg, #c97a4a 0%, #f2b48a 45%, #d88a58 100%); }
.r-B  { --matiere: linear-gradient(125deg, #6fb596 0%, #b6e0cc 50%, #82c2a6 100%); }
.r-C  { --matiere: linear-gradient(125deg, #9eb0c4 0%, #d6dfea 50%, #aebfd1 100%); }
.r-D, .r-sort, .r-objet { --matiere: var(--case); }
@container (max-width: 130px) {
  .gi-carte .c-nom, .gi-carte .c-txt { display: none; }
  .gi-carte .c-tete { grid-template-columns: 1fr auto; padding: 4cqi; }
  .gi-carte .c-num { font-size: 17cqi; }
  .gi-carte .gi-rang { font-size: 13cqi; padding: 2.5cqi 4cqi; }
  .gi-carte .gi-rang .lim, .gi-carte .r-sort, .gi-carte .r-objet { display: none; }
  .gi-carte.f-sort .c-tete, .gi-carte.f-objet .c-tete { grid-template-columns: 1fr; }
  .gi-carte .c-cadre { padding: 6cqi; gap: 5cqi; grid-template-rows: auto 1fr; }
}
.gi-carte.dos .c-cadre { background: #15233f; box-shadow: inset 0 0 0 1.2cqi #15233f, inset 0 0 0 2.2cqi var(--or), inset 0 0 0 3.4cqi #15233f, inset 0 0 0 4cqi var(--or); place-items: center; grid-template-rows: 1fr; }
.gi-carte.dos svg { width: 58%; height: auto; }

/* ---------- Cinématique du tirage ---------- */
.cine { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; visibility: hidden; }
.cine.joue { visibility: visible; pointer-events: auto; cursor: pointer; }
.cine .nuit { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 44%, #1d2027 0, #0e0f13 48%, #060608 90%); opacity: 0; }
.cine .lignes { position: absolute; inset: -30%; opacity: 0; }
.cine .lignes svg { width: 100%; height: 100%; }
.cine canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cine .lettre { position: absolute; left: max(10px, calc(50% - 210px)); top: max(8px, calc(50% - 46vh)); transform-origin: 30% 60%; font: 400 min(50vw, 230px)/0.8 var(--f-titre); letter-spacing: -0.06em; white-space: nowrap; color: var(--lettre, #fff); -webkit-text-stroke: 3px rgba(255, 255, 255, 0.85); opacity: 0; rotate: -8deg; }
.cine .lettre.mot { font-size: min(21vw, 110px); letter-spacing: -0.02em; }
.cine .lettre.creux { color: transparent; -webkit-text-stroke: 4px rgba(233, 236, 242, 0.5); }
.cine .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.cine .scene { position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 18vh; }
.cine .vol { width: min(64vw, 290px, calc((100dvh - 300px) * 63 / 88)); perspective: 1300px; opacity: 0; }
.cine .retourne { position: relative; transform-style: preserve-3d; transform: rotateY(180deg); }
.cine .retourne > .gi-carte { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
/* Ombre portée en box-shadow : un filtre drop-shadow se recalcule à chaque image pendant le vol (lent sur téléphone). */
.cine .retourne > .gi-carte:not(.dos) .c-cadre { box-shadow: inset 0 0 0 0.8cqi rgba(0, 0, 0, 0.35), 0 18px 30px rgba(0, 0, 0, 0.55); }
.cine .retourne > .dos .c-cadre { box-shadow: inset 0 0 0 1.2cqi #15233f, inset 0 0 0 2.2cqi var(--or), inset 0 0 0 3.4cqi #15233f, inset 0 0 0 4cqi var(--or), 0 18px 30px rgba(0, 0, 0, 0.55); }
.cine .vol { will-change: transform; }
/* Rayons des hauts rangs : élément animé par le navigateur (rotation, fondu), sans repeindre l'écran à chaque image. */
.cine .rayons { position: absolute; left: 50%; top: calc((100% - 18vh) / 2); width: 230vmax; aspect-ratio: 1; translate: -50% -50%; opacity: 0; background: repeating-conic-gradient(var(--rayons, #fff) 0deg 5deg, transparent 5deg 13deg, var(--rayons, #fff) 13deg 15deg, transparent 15deg 22.5deg); -webkit-mask-image: radial-gradient(closest-side, #000 0, rgba(0, 0, 0, 0.6) 30%, transparent 72%); mask-image: radial-gradient(closest-side, #000 0, rgba(0, 0, 0, 0.6) 30%, transparent 72%); will-change: transform, opacity; }
.cine .retourne > .dos { position: absolute; inset: 0; transform: rotateY(180deg); }
.cine .gain-jenny { position: absolute; left: 50%; top: 40%; translate: -50% -50%; font: 400 min(26vw, 120px)/1 var(--f-titre); color: #f6d36b; -webkit-text-stroke: 3px #fff; white-space: nowrap; opacity: 0; }
.cine .gain-jenny small { font-size: 0.5em; margin-left: 0.12em; }
.cine .dialogue { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 24px), 440px); translate: -50% 0; opacity: 0; }
.cine .dialogue .a-indice { margin: 0; font: 600 14px/1.3 var(--f-texte); color: #c3c6cc; opacity: 0; transition: opacity 0.3s; }
.cine .dialogue .a-indice.visible { opacity: 1; }
.cine .passer { position: absolute; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; translate: -50% 0; font: 600 13px var(--f-texte); color: rgba(235, 238, 242, 0.75); white-space: nowrap; opacity: 0; transition: opacity 0.25s; }
.cine.intro .passer { opacity: 1; transition-delay: 0.6s; }
.vole-seul { position: fixed; z-index: 45; width: 64px; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

<div class="app">
  <div class="proto" role="group" aria-label="Commandes du prototype">
    <p>Prototype : choisis l'issue, puis touche le viseur pour scanner.</p>
    <div class="rang" id="issues-ok"><span>Tirage</span></div>
    <div class="rang" id="issues-refus"><span>Refus</span></div>
    <div class="rang"><span>État</span>
      <button id="t-souffle" aria-pressed="true">Second souffle : 1</button>
      <button id="t-reseau" aria-pressed="false">Couper le réseau</button>
    </div>
  </div>

  <header class="barre" aria-label="État de la partie">
    <span class="chrono">1:24:10</span>
    <span class="liaison"><i class="pastille" id="pastille"></i><span id="liaison-txt">En ligne</span></span>
    <span class="jenny" id="jenny"><span id="jenny-n">1 250</span><small>J</small></span>
  </header>

  <div class="tete-page">
    <h1>Scanner</h1>
    <span class="gps"><i class="pastille"></i>Position à jour</span>
  </div>

  <div class="viseur" id="viseur" role="button" tabindex="0" aria-label="Viseur de la caméra. Prototype : toucher pour scanner la balise.">
    <div class="flux" id="flux" aria-hidden="true">
      <div class="fond"></div>
      <div class="piquet"></div>
      <div class="plaque"><div id="qr-balise"></div><small>BALISE 0417</small></div>
    </div>
    <div class="cible" id="cible" aria-hidden="true"><i class="coin hg"></i><i class="coin hd"></i><i class="coin bg"></i><i class="coin bd"></i></div>
    <div class="eclair" id="eclair"></div>
    <div class="file" id="file" aria-live="polite">
      <div class="pile" id="pile" aria-hidden="true"></div>
      <p id="file-txt"></p>
    </div>
    <div class="bandeau">Vise le QR d'une balise<span>La lecture est automatique</span></div>

<script>

const ECLATS = {

const ISSUES_OK = {

  A: { gains: [['carte', 'A']] }, S: { gains: [['carte', 'S']] }, SS: { gains: [['carte', 'SS']] },
  Sort: { gains: [['carte', 'sort']] }, Jenny: { gains: [['jenny', 40]] },

const ISSUES_REFUS = {
  Délai: { code: 'delai', message: 'Attends encore 12 s avant de scanner' },
  Boucle: { code: 'boucle', message: 'Boucle : scanne encore 2 balises différentes' },

let choix = 'A', aSouffle = true, enLigne = true, file = [], jenny = 1250, occupe = false;

function boutons(id, liste) {

}
boutons('#issues-ok', ISSUES_OK); boutons('#issues-refus', ISSUES_REFUS);
document.querySelectorAll('[data-issue]').forEach((b) => b.addEventListener('click', () => {
  choix = b.dataset.issue;

$('#t-souffle').addEventListener('click', (e) => { aSouffle = !aSouffle; e.currentTarget.setAttribute('aria-pressed', aSouffle); e.currentTarget.textContent = `Second souffle : ${aSouffle ? 1 : 0}`; });
$('#t-reseau').addEventListener('click', () => (enLigne ? couperReseau() : void retourReseau()));

// ---------- Image de caméra simulée ----------
(function () {
  const q = qrcode(0, 'M'); q.addData('GQ:B:0417'); q.make();
  $('#qr-balise').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
})();
const flux = $('#flux');
let figee = false, tFlux = 0;
function bouger(now) {
  if (!figee) {
    // Tenue à la main : petite dérive lente, jamais au repos (c'est une caméra).
    const x = Math.sin(now / 1300) * 5 + Math.sin(now / 470) * 1.2, y = Math.cos(now / 1700) * 4 + Math.sin(now / 610) * 1;
    flux.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(Math.sin(now / 2100) * 0.8).toFixed(2)}deg)`;
  }
  if (!reduit) requestAnimationFrame(bouger);
}
requestAnimationFrame(bouger);

// ---------- Outils ----------
const cine = $('#cine'), nuit = $('#nuit'), lignes = $('#lignes'), lettre = $('#lettre'), vol = $('#vol'), ret = $('#ret'), face = $('#face');
const rayonsEl = $('#rayons');
let tourne = null;
const rayons = (de, a, ms, easing = 'linear') => A(rayonsEl, [{ opacity: de }, { opacity: a }], { duration: ms, easing });
const dialogue = $('#dialogue'), dTexte = $('#d-texte'), dIndice = $('#d-indice'), flash = $('#flash'), gainJenny = $('#gain-jenny'), scene = $('#scene');
let anims = [], attentes = new Set(), saute = false, phase = 'repos', attenteToucher = null, revelA = 0;
const A = (el, k, o) => { const a = el.animate(k, { fill: 'forwards', easing: 'cubic-bezier(.16,1,.3,1)', ...o, duration: reduit ? 1 : o.duration }); anims.push(a); return a; };

  return new Promise((res) => {

    const t = setTimeout(f, ms); attentes.add(f);
  });
}
const finAnim = (a) => a.finished.catch(() => {});
function sauter() { if (saute) return; saute = true; [...attentes].forEach((f) => f()); }
function viderAnims() { anims.forEach((a) => a.cancel()); anims = []; }
function carteHTML(c) {
  const coin = c.genre === 'sort' ? '<span class="gi-rang r-sort">Sort</span>' : c.genre === 'objet' ? '<span class="gi-rang r-objet">Objet</span>' : `<span class="gi-rang r-${c.rang}">${c.rang}<span class="lim">-${c.lim}</span></span>`;
  const fil = c.genre === 'designee' ? c.num : c.genre === 'sort' ? 'S' : 'O';
  return `<div class="gi-carte f-${c.genre}"><div class="c-cadre"><div class="c-tete"><span class="c-num${c.num.length > 3 ? ' long' : ''}">${c.num}</span><span class="c-nom${c.nom.length > 10 ? ' long' : ''}">${c.nom}</span>${coin}</div><div class="c-art"><span class="c-filigrane">${fil}</span></div><p class="c-txt">${c.txt}</p></div></div>`;
}
function taper(el, texte) {
  el.textContent = '';
  if (reduit || saute) { el.textContent = texte; return Promise.resolve(); }
  return new Promise((res) => {
    let n = 0;
    const pas = () => { if (saute) { el.textContent = texte; return res(); } el.textContent = texte.slice(0, ++n); n >= texte.length ? res() : setTimeout(pas, 22); };
    pas();
  });
}
const centre = (el) => { const b = el.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; };
const vibrer = (p) => navigator.vibrate?.(p);

// Lignes de concentration (même dessin que la licence et le Book)
(function () {
  let s = 41; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let d = '';
  for (let i = 0; i < 130; i++) {
    const a = r() * Math.PI * 2, r0 = 40 + r() * 26, w = 0.004 + r() * 0.014;
    const p = (ang, rad) => `${(Math.cos(ang) * rad).toFixed(1)} ${(Math.sin(ang) * rad).toFixed(1)}`;
    d += `M${p(a, r0)}L${p(a - w, 170)}L${p(a + w, 170)}Z`;
  }
  lignes.innerHTML = `<svg viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid slice"><path d="${d}" fill="#e9ecf2"/></svg>`;
})();

// ---------- Effets (canvas) : fumée de l'apparition, lumière qui fuit des bords, étincelles, rayons, ondes ----------
const cv = $('#fx'), ctx = cv.getContext('2d');
let dpr = 1, parts = [], ondes = [], image = 0, dernier = 0;
let fx = { fuite: 0, fuiteCol: '#fff', rayons: 0, rayonsCol: '#fff', rot: 0, emettre: 0 };
// Lueurs douces : 1,5 pixel par point suffit (un téléphone en a 3, quatre fois plus de pixels à remplir).
function taille() { dpr = Math.min(1.5, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', taille); taille();
const lueurs = {};
function lueur(col) {
  if (lueurs[col]) return lueurs[col];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, col); rg.addColorStop(0.35, col + '99'); rg.addColorStop(1, col + '00');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return (lueurs[col] = c);
}
const rectCarte = () => ret.getBoundingClientRect();
function pointDuBord(b) {
  const per = 2 * (b.width + b.height); let t = Math.random() * per;
  if (t < b.width) return [b.left + t, b.top, 0, -1];
  t -= b.width; if (t < b.height) return [b.right, b.top + t, 1, 0];
  t -= b.height; if (t < b.width) return [b.right - t, b.bottom, 0, 1];
  t -= b.width; return [b.left, b.bottom - t, -1, 0];
}
function fumee(x, y, n) {
  lancerBoucle();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 260;
    parts.push({ type: 'fumee', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7 - 30, r: 14 + Math.random() * 26, vie: 0, max: 0.55 + Math.random() * 0.5 });
  }
}
// Plafond de particules : un SS en émettait plus de 1 000 à la fois, trop pour un téléphone.
const MAX_PARTS = 300;
function etincelles(x, y, n, col, force = 1) {
  lancerBoucle();
  n = Math.min(n, MAX_PARTS - parts.length);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (240 + Math.random() * 620) * force;
    parts.push({ type: 'etincelle', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, vie: 0, max: 0.45 + Math.random() * 0.7, t: 2 + Math.random() * 4 });
  }
}
function fuiteBords(n, col) {
  n = Math.min(n, MAX_PARTS - parts.length);
  const b = rectCarte();
  for (let i = 0; i < n; i++) {
    const [x, y, nx, ny] = pointDuBord(b), v = 40 + Math.random() * 120;
    parts.push({ type: 'etincelle', x, y, vx: nx * v, vy: ny * v - 30, col, vie: 0, max: 0.35 + Math.random() * 0.4, t: 2 + Math.random() * 3 });
  }
}
function onde(x, y, col, max = 1.4) { lancerBoucle(); ondes.push({ x, y, col, vie: 0, max: 0.55, rmax: Math.max(innerWidth, innerHeight) * 0.55 * max }); }
function boucle(now) {
  const dt = Math.max(0, Math.min(0.05, (now - dernier) / 1000)); dernier = now;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  const b = rectCarte();
  if (fx.emettre) fuiteBords(Math.round(fx.emettre * dt), fx.fuiteCol);
  // Lumière qui fuit des bords de la carte encore retournée (annonce le rang).
  if (fx.fuite > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = fx.fuite * (0.8 + Math.random() * 0.2);

    const a0 = ctx.globalAlpha;

  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.vie += dt;
    const a = 1 - p.vie / p.max; if (a <= 0) { parts.splice(i, 1); continue; }
    if (p.type === 'fumee') {
      p.vx *= 0.9; p.vy *= 0.9; p.x += p.vx * dt; p.y += p.vy * dt; p.r += 60 * dt;
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#d9dce2';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();

      p.vx *= 0.94; p.vy = p.vy * 0.94 + 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt;

    const o = ondes[i]; o.vie += dt; const k = o.vie / o.max; if (k >= 1) { ondes.splice(i, 1); continue; }

let extinction = 0;
function eteindre(cle, ms) {

  const pas = (t) => { if (id !== extinction) return; fx[cle] = Math.max(0, d0 * (1 - (t - t0) / ms)); if (fx[cle] > 0) requestAnimationFrame(pas); };

// ---------- Toucher pendant la cinématique ----------
function toucher() { return new Promise((res) => { attenteToucher = res; }); }
function surToucher() {
  if (phase === 'intro') sauter();

}

addEventListener('keydown', (e) => { if (cine.classList.contains('joue') && ['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); surToucher(); } });

// ---------- Viseur ----------
const viseur = $('#viseur'), cible = $('#cible');
async function verrouiller() {
  figee = true;

  $('#eclair').animate([{ opacity: 0.7 }, { opacity: 0 }], { duration: reduit ? 1 : 260, easing: 'ease-out' });
  await finAnim(a);
  return a;
}
function deverrouiller(lock) { lock?.cancel(); cible.classList.remove('refus'); figee = false; }

async function scanner(issue) {
  if (occupe) return;
  occupe = true;
  $('#reponse').innerHTML = '';
  const lock = await verrouiller();
  try {
    if (!enLigne) await mettreEnFile(issue);
    else await jouerIssue(issue);
  } finally {
    deverrouiller(lock);
    occupe = false;
  }
}
const issueChoisie = () => ISSUES_OK[choix] ? { type: 'ok', ...ISSUES_OK[choix] } : { type: 'refus', ...ISSUES_REFUS[choix] };
viseur.addEventListener('click', (e) => {
  // Toucher la boîte du jeu (hors boutons) la ferme et rend le viseur.
  if (e.target.closest('.reponse .gi-dialogue') && !e.target.closest('button')) { $('#reponse').innerHTML = ''; return; }
  if (e.target.closest('.reponse:not(:empty), .file')) return; void scanner(issueChoisie()); });
viseur.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); void scanner(issueChoisie()); } });
$('#ouvrir-saisie').addEventListener('click', (e) => { const o = $('#saisie').classList.toggle('visible'); e.currentTarget.setAttribute('aria-expanded', o); if (o) $('#code').focus(); });
$('#saisie').addEventListener('submit', (e) => { e.preventDefault(); void scanner(issueChoisie()); });

async function jouerIssue(issue, souffleUtilise = false) {
  if (issue.type === 'refus') return refuser(issue);
  for (let i = 0; i < issue.gains.length; i++) {
    const [kind, v] = issue.gains[i];
    if (kind === 'jenny') await jouerJenny(v, i === 0);
    else await jouerCarte(CARTES[v], i === 0, souffleUtilise && i === 0);
  }
}

// ---------- Refus : en clair, dans la boîte du jeu ; le viseur reste prêt ----------
async function refuser(issue) {
  cible.classList.add('refus');
  vibrer([20, 60, 20]);
  viseur.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(2px)' }, { transform: 'translateX(0)' }], { duration: reduit ? 1 : 340, easing: 'ease-out' });
  const rep = $('#reponse');
  rep.innerHTML = `<div class="gi-dialogue"><span class="a-qui refus">Scan refusé</span><p class="a-texte"></p></div>`;
  await taper($('.a-texte', rep), issue.message);
  if (issue.code === 'boucle' && aSouffle) {
    $('.gi-dialogue', rep).insertAdjacentHTML('beforeend', `
      <div class="souffle-ligne" id="souffle"><div id="souffle-carte">${carteHTML(CARTES.souffle)}</div>
      <p>Tu as un <b>Second souffle</b> : il te laisse rescanner cette balise sans faire la boucle.</p></div>

    $('#souffle-non').addEventListener('click', () => { $('#reponse').innerHTML = ''; });
  }

}

// Second souffle : la carte d'objet monte dans le viseur, se consume en vent, puis le scan repart.
async function utiliserSouffle() {
  if (occupe) return;
  occupe = true;
  const src = $('#souffle-carte').getBoundingClientRect(), [vx, vy] = centre($('.plaque'));
  const el = document.createElement('div'); el.className = 'vole-seul'; el.innerHTML = carteHTML(CARTES.souffle);

// ---------- Carte : apparition dans la fumée, fuite du rang, retournement, rangement ----------
async function jouerCarte(c, premier, souffleUtilise) {

  dialogue.style.opacity = '0'; dIndice.classList.remove('visible'); dTexte.textContent = '';

  lancerBoucle();

  // 1. La nuit sort du QR visé ; lignes de vitesse.

  const R = Math.hypot(innerWidth, innerHeight);
  A(nuit, [{ opacity: 1, clipPath: `circle(${premier ? 0 : R}px at ${qx}px ${qy}px)` }, { opacity: 1, clipPath: `circle(${R}px at ${qx}px ${qy}px)` }], { duration: 480, easing: 'cubic-bezier(.5,0,.2,1)' });
  A(lignes, [{ opacity: 0, transform: 'scale(1.4)' }, { opacity: 0.75, transform: 'scale(1)', offset: 0.5 }, { opacity: 0.35, transform: 'scale(.98)' }], { duration: 1100, easing: 'linear' });

  // 2. Pouf : la carte jaillit de dos dans un nuage de fumée, en tournoyant.
  await pause(160);
  const s = scene.getBoundingClientRect(), [cx, cy] = [s.left + s.width / 2, s.top + (s.height - innerHeight * 0.18) / 2];
  if (!saute) { fumee(cx, cy, 34); vibrer(10); }
  const dx0 = qx - cx, dy0 = qy - cy;
  A(vol, [
    { transform: `translate(${dx0}px, ${dy0}px) scale(.18)`, opacity: 0 },
    { transform: `translate(${dx0 * 0.2}px, ${dy0 * 0.2 - 30}px) scale(.9)`, opacity: 1, offset: 0.45 },
    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
  ], { duration: 620, easing: 'cubic-bezier(.2,.9,.25,1)' });
  A(ret, [{ transform: 'rotateY(900deg)' }, { transform: 'rotateY(180deg)' }], { duration: 760, easing: 'cubic-bezier(.12,.8,.2,1)' });
  await pause(720);

    A(ret, [{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(-14deg)', offset: 0.7 }, { transform: 'rotateY(0deg)' }], { duration: 440, easing: 'cubic-bezier(.3,0,.2,1)' });

}
function phraseGain(c) {

  A(lettre, [{ opacity: 0, transform: 'scale(2.2)' }, { opacity: c.rang === 'D' ? 1 : 0.95, transform: 'scale(1)' }], { duration: 360, easing: 'cubic-bezier(.5,0,.75,0)' });

// 6. Rangement : la carte file en arc vers l'onglet (Book, ou Sorts), la nuit se referme dessus.
